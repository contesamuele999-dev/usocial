# Costruisce l'immagine Docker di uSocial e la pubblica su GitHub Container
# Registry (ghcr.io). La VM di produzione non compila piu' nulla: fa solo
# `docker compose pull` e riparte in una trentina di secondi.
#
# Il runner di GitHub e' amd64 come la VM GCP, quindi non serve cross-build.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch: # permette di lanciarlo a mano dalla tab Actions

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necessario per pubblicare su ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN e' generato in automatico: nessun segreto da configurare
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Due tag: "latest" per il deploy, lo SHA del commit per poter
          # tornare indietro a una versione precedente in caso di problemi.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Cache dei layer fra un run e l'altro: i build successivi che non
          # toccano package-lock.json saltano npm ci e la compilazione nativa.
          cache-from: type=gha
          cache-to: type=gha,mode=max
