# uSocial — deploy di produzione con HTTPS automatico.
#
# Avvio sul server:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Richiede nel file .env:
#   APP_DOMAIN=iltuonome.duckdns.org        (dominio pubblico che punta al server)
#   APP_URL=https://iltuonome.duckdns.org   (stesso dominio, con https)
#
# Caddy (reverse proxy) ottiene e rinnova da solo il certificato HTTPS.
# L'app NON espone la porta 3000 su internet: passa solo da Caddy (80/443).
services:
  usocial:
    build: .
    container_name: usocial
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data # database SQLite + media, persistenti sull'host
    expose:
      - "3000" # visibile solo agli altri container, non a internet
    networks:
      # IP fisso: Caddy ci punta direttamente, senza passare dal DNS interno di
      # Docker. Quando la VM va in swap il resolver di dockerd può non
      # rispondere ("lookup usocial: i/o timeout") e il sito restituisce 502
      # pur essendo l'app perfettamente viva.
      usocial_net:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: usocial-caddy
    depends_on:
      - usocial
    environment:
      - APP_DOMAIN=${APP_DOMAIN} # letto dal .env, usato nel Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Media in sola lettura: Caddy serve /files/* da qui senza passare da Node
      # (vedi Caddyfile). Stessa cartella montata su /app/data nell'app.
      # Il nome della cartella dentro il container ("files") deve combaciare con
      # il prefisso dell'URL: così Caddy trova il file senza riscrivere l'URI, e
      # la richiesta che inoltra a Node per i poster mancanti resta /files/:nome.
      - ./data/media:/srv/files:ro
      - caddy_data:/data # certificati TLS (persistenti)
      - caddy_config:/config
    networks:
      - usocial_net
    restart: unless-stopped

networks:
  usocial_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
